# Local development overlay — loopback HTTP only (no HSTS).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
#
# Open http://127.0.0.1:8080
# .env must include:
#   ADMIN_ALLOWED_ORIGINS=http://127.0.0.1:8080
#   ADMIN_COOKIE_SECURE=0
#   TRUST_PROXY=1
#   API_DOMAIN=localhost

services:
  dashboard:
    environment:
      ADMIN_COOKIE_SECURE: "0"

  caddy:
    # Replace production 80/443 publishes with loopback-only HTTP.
    ports: !override
      - "127.0.0.1:8080:80"
    volumes: !override
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      API_DOMAIN: localhost
