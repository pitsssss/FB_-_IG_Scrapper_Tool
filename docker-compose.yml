# Single-replica only: filesystem Apify quota in CACHE_DIR is not multi-replica safe.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CACHE_DIR: /data/cache
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - api_data:/data
    # Do not publish host ports here; Caddy terminates TLS. Secrets come from env_file at runtime.
    # Keep a single api replica: filesystem quota is not multi-replica safe.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  api_data:
  caddy_data:
  caddy_config:
