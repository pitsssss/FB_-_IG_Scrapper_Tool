name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: test (Node ${{ matrix.node-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show versions
        run: node -v && npm -v

      - name: Unit tests
        run: npm test

      - name: End-to-end tests
        run: npm run e2e

      # Zero runtime dependencies. No APIFY_TOKEN; e2e uses fake upstream.

  postman-offline:
    name: postman offline (ubuntu / Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Newman (devDependency)
        run: npm install
      - name: Postman offline
        run: npm run postman:offline

  dashboard:
    name: dashboard (ubuntu / Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  docker-smoke:
    name: docker API smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Make smoke script executable
        run: chmod +x scripts/docker-smoke.sh
      - name: Docker build, health, auth, volume persistence
        env:
          IMAGE_TAG: fb-posts-api:ci-${{ github.sha }}
          API_PORT: "18080"
        run: ./scripts/docker-smoke.sh

  compose-smoke:
    name: compose full-stack smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # compose:smoke creates a synthetic env file and runs `docker compose config -q`
      # itself. Do not require a committed/.env here — the repo intentionally omits it.
      - name: Isolated compose smoke
        run: npm run compose:smoke

  license-pack:
    name: dashboard LGPL license pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify license texts, pins, and non-publishing release workflow
        run: node scripts/verify-docker-license-pack.mjs

  audit-dev:
    name: npm audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Root audit (Newman toolchain)
        run: npm install && npm audit --audit-level=high || true
      - name: Dashboard audit
        working-directory: apps/dashboard
        run: npm ci && npm audit --audit-level=high || true
